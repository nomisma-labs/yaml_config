[build-system]
requires = ["scikit-build-core==0.11.6"]
build-backend = "scikit_build_core.build"

[project]
name = "nomisma-imported-example"
dynamic = ["version"]
requires-python = ">=3.10"

[tool.scikit-build]
cmake.version = ">=3.30"
ninja.version = ">=1.11"
build-dir = "build/wheel"
wheel.packages = ["nom_imported_example"]
install.components = ["nom_python"]

[tool.scikit-build.cmake.define]
IMPORTED_WHEEL_BUILD_PYTHON = "ON"
IMPORTED_WHEEL_INSTALL = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(imported_wheel VERSION (?P<value>[0-9.]+)'
