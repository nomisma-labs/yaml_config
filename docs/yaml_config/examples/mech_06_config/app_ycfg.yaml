- ycfg:
    name: base
    gen_file: app.yaml
  log:
    level: debug
    file:
      name: dev.log
      rotationSize: 1500000
  connection:
    address: wss://dev.example/ws
    timeout_s: 5
  subscription:
    symbols:
      - btcusdt
      - solusdt
    channels:
      - trade
      - depth
- ycfg:
    name: ci
    extend: base
  log:
    level: warn
    file:
      name: ci.log
  connection:
    timeout_s: 20
  subscription:
    symbols:
      - ethusdt
