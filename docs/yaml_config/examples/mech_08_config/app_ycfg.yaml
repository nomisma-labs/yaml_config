- ycfg:
    name: base
    gen_file: app.yaml
  log:
    level: debug
    file: capture.log
  subscription:
    symbols:
      - btcusdt
    channels:
      - trade
      - depth
    snapshot: true
- ycfg:
    name: ci
    extend: base
  log:
    file: "ycfg:delete"
  subscription:
    "ycfg:override":
      symbols:
        - ethusdt
      channels:
        - trade
