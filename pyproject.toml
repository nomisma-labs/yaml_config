[build-system]
requires = ["scikit-build-core==0.11.6"]
build-backend = "scikit_build_core.build"

[project]
name = "nomisma-cmake-example"
dynamic = ["version"]
description = "Native Python packaging example for the Nomisma CMake template"
requires-python = ">=3.10"
license = "LicenseRef-Nomisma-Labs-Proprietary"
license-files = ["LICENSE", "external/nlohmann_json/LICENSE.MIT"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=4.4,<4.5"
ninja.version = ">=1.11"
cmake.build-type = "Release"
wheel.packages = ["python/nomisma_example"]
install.components = ["nom_python"]
sdist.include = ["external/nlohmann_json/**"]
sdist.exclude = ["build/**", "dist/**"]

[tool.scikit-build.cmake.define]
CMAKE_TEMPLATE_BUILD_PYTHON = "ON"
CMAKE_TEMPLATE_BUILD_APPS = "OFF"
CMAKE_TEMPLATE_BUILD_TESTS = "OFF"
CMAKE_TEMPLATE_INSTALL = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = '(?s)project\s*\(\s*cmake_template\s+VERSION\s+(?P<value>[0-9]+\.[0-9]+\.[0-9]+)'
