#
# Template only: jobs that check cmake_template itself. tools/init_project.py removes this
# workflow from new repos; the template-owned ci.yml runs everywhere.
name: ci-template

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python_package:
    name: native Python wheel example
    runs-on: ubuntu-26.04
    container: ghcr.io/${{ github.repository_owner }}/ci:latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Prepare Python packaging environment
        run: |
          python3 -m venv build/python-env
          build/python-env/bin/python -m pip install -r tools/kit/python_package_requirements.txt
      - name: Configure wheel integration test
        run: >-
          cmake --preset ci -DCMAKE_TEMPLATE_TEST_PYTHON_PACKAGE=ON
          -DNOM_PYTHON_EXECUTABLE="$PWD/build/python-env/bin/python"
      - name: Build, install and import wheels
        run: ctest --preset ci -R python_package --no-tests=error

  template_owned:
    name: template-owned files stay generic
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # tools/kit/sync_template.py copies template-owned files into every repo, so they must not
      # mention the example package or the template's own CMAKE_TEMPLATE_* options.
      - name: Search template-owned files for template-only names
        run: |
          python3 - <<'EOF'
          import subprocess, sys
          sys.path.insert(0, "tools/kit")
          from sync_template import TEMPLATE_OWNED
          found = subprocess.run(["git", "grep", "-nE", "CMAKE_TEMPLATE_|nomisma_example", "--", *TEMPLATE_OWNED])
          if found.returncode == 0:
              print("::error::move template-only content out of template-owned files")
          sys.exit(0 if found.returncode == 1 else 1)
          EOF
