#
# Template only: builds docker/ci/Dockerfile and publishes ghcr.io/<owner>/ci for every repo's
# ci.yml. After the first run, make the package public (docs/kit/new_repo.md).
name: ci-image

on:
  push:
    branches: [master]
    paths: [docker/ci/**, .github/workflows/ci_image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: docker/ci
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ci:latest
            ghcr.io/${{ github.repository_owner }}/ci:${{ github.sha }}
